<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Variante B – „Schild": Sicherheits-/Forensik-Charakter. Ein Schild im Akzent mit hellem
       Innenfeld, darin ein „N" und ein kleines Schloss. Verbindet Notizen mit dem Werkzeug-Charakter. -->
  <defs>
    <linearGradient id="b_shield" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8a9aae"/>
      <stop offset="1" stop-color="#55647a"/>
    </linearGradient>
    <linearGradient id="b_metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f5f6"/>
      <stop offset="1" stop-color="#c3c9d0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#1e1e1e"/>

  <!-- Schild-Schatten -->
  <path d="M128 40 l72 26 v52 c0 52-34 84-72 98 c-38-14-72-46-72-98 V66 Z"
        fill="#000000" fill-opacity="0.28" transform="translate(4 8)"/>
  <!-- Schild -->
  <path d="M128 40 l72 26 v52 c0 52-34 84-72 98 c-38-14-72-46-72-98 V66 Z" fill="url(#b_shield)"/>
  <!-- Lichtkante -->
  <path d="M128 40 l72 26 v52 c0 52-34 84-72 98 c-38-14-72-46-72-98 V66 Z"
        fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="3"/>

  <!-- „N" aus hellem Metall -->
  <path d="M96 156 V96 L160 156 V96" fill="none" stroke="url(#b_metal)" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- kleines Schloss unten -->
  <g transform="translate(112 158)">
    <rect x="0" y="10" width="32" height="24" rx="5" fill="#f4f5f6"/>
    <path d="M6 10 v-6 a10 10 0 0 1 20 0 v6" fill="none" stroke="#f4f5f6" stroke-width="5"/>
    <circle cx="16" cy="21" r="3.5" fill="#55647a"/>
  </g>
</svg>
