<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- Notex App-Icon: dunkles, abgerundetes Quadrat; darauf ein "N" aus gebürstetem Metall,
       das als Objekt auf dem Hintergrund liegt (weicher Schatten, dunkle Unterkante, Lichtkante).
       Der Schatten ist aus mehreren Strichen gebaut, damit er auch ohne SVG-Filter funktioniert. -->
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0"    stop-color="#f4f4f4"/>
      <stop offset="0.22" stop-color="#c9c9c9"/>
      <stop offset="0.38" stop-color="#ececec"/>
      <stop offset="0.55" stop-color="#9a9a9a"/>
      <stop offset="0.72" stop-color="#d8d8d8"/>
      <stop offset="0.88" stop-color="#a6a6a6"/>
      <stop offset="1"    stop-color="#e0e0e0"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5a5a5a"/>
      <stop offset="1" stop-color="#2e2e2e"/>
    </linearGradient>
    <linearGradient id="fold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#9fb0c4"/>
      <stop offset="1" stop-color="#5f6f84"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="256" height="256" rx="56" fill="#1e1e1e"/>

  <!-- Weicher Schatten: mehrere versetzte, immer breitere Striche mit wenig Deckkraft -->
  <g fill="none" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" transform="translate(4 9)">
    <path d="M76 196 V60 L180 196 V60" stroke-width="34" stroke-opacity="0.10"/>
    <path d="M76 196 V60 L180 196 V60" stroke-width="28" stroke-opacity="0.14"/>
    <path d="M76 196 V60 L180 196 V60" stroke-width="22" stroke-opacity="0.22"/>
  </g>

  <!-- Dunkle Unterkante (Materialdicke), leicht nach unten versetzt -->
  <path d="M76 196 V60 L180 196 V60" fill="none" stroke="url(#edge)" stroke-width="20"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(0 3)"/>
  <!-- Metallkörper -->
  <path d="M76 196 V60 L180 196 V60" fill="none" stroke="url(#metal)" stroke-width="18"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Lichtkante oben links -->
  <path d="M76 196 V60 L180 196 V60" fill="none" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"
        stroke-linecap="round" stroke-linejoin="round" transform="translate(-2 -2)"/>

  <!-- Blatt-Eck im Akzent, ebenfalls mit Schatten und Licht -->
  <path d="M190 48 h28 v28 z" fill="#000000" fill-opacity="0.25" transform="translate(3 6)"/>
  <path d="M190 48 h28 v28 z" fill="url(#fold)"/>
  <path d="M190 48 h28" stroke="#ffffff" stroke-opacity="0.5" stroke-width="2" stroke-linecap="round"/>
</svg>
